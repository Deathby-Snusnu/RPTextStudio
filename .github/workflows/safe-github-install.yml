name: Safe GitHub AddOn updates

on:
  pull_request:
    paths:
      - "safe_github_install.py"
      - "addon_manager.py"
      - "wow_client_profiles.py"
      - "tests/test_safe_github_install.py"
      - ".github/workflows/safe-github-install.yml"
  push:
    branches: [main]
    paths:
      - "safe_github_install.py"
      - "addon_manager.py"
      - "wow_client_profiles.py"
      - "tests/test_safe_github_install.py"
      - ".github/workflows/safe-github-install.yml"

jobs:
  test-safe-install:
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.10", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - name: Test backed-up and protected AddOn updates
        run: python -m unittest discover -s tests -p "test_safe_github_install.py" -v
